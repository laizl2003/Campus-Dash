# 生产形态的 nginx：静态托管 + 反代。
# 前端与 API 同源（都走 http://localhost:8088），所以 CORS 在这条链路里不起作用。
#
#   /            -> 构建产物 index.html（hash 路由，不需要 history fallback）
#   /api/**      -> app:8080，路径原样透传
#   /ws          -> app:8080，必须升级协议
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 现在是 hash 路由（#/square），这行其实用不上：
    # 留着是为了以后切成 history 模式时不用再改 nginx
    location / {
        try_files $uri $uri/ /index.html;
        # 入口 HTML 不缓存：否则发版后浏览器仍加载旧的 assets 哈希，页面跑的是旧代码
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        # 必须用 $http_host 而不是 $host：$host 会丢掉端口，
        # 后端据此把请求当成 http://app:8080，与浏览器 Origin http://host:8088 不同源，
        # 于是同一个站点的 POST 被判成跨域并返回 403 Invalid CORS request
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Agent 服务（Python/FastAPI，独立容器，内部端口 8000）
    # /agent/sessions、/agent/chat 去掉前缀后透传，前端无需知道服务地址
    location /agent/ {
        # agent 容器每次重建 IP 都可能变。proxy_pass 直接写主机名时，nginx 只在
        # reload 那一刻解析一次，之后一直用旧 IP —— 表现为 agent 容器明明 healthy，
        # 但 /agent/* 全部 502。这里用变量 + Docker 内置 DNS 按 TTL 重新解析。
        # 注意：proxy_pass 用变量后 nginx 不再自动剥前缀，必须显式 rewrite。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $agent_backend http://agent:8000;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass $agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # WebSocket：Upgrade / Connection 两个头缺一不可，
    # 少了它们握手会被当成普通 HTTP 请求，表现为"页面正常但推送永远收不到"。
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $http_host;
        proxy_read_timeout 3600s;   # 必须大于前端 30s 心跳，否则空闲连接被掐
    }

    # 带内容哈希的静态资源可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
