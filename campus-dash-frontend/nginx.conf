# 生产形态的 nginx：静态托管 + 反代。
# 前端与 API 同源（都走 http://localhost:8088），所以 CORS 在这条链路里不起作用。
#
#   /            -> 构建产物 index.html（hash 路由，不需要 history fallback）
#   /api/**      -> app:8080，路径原样透传
#   /ws          -> app:8080，必须升级协议
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 现在是 hash 路由（#/square），这行其实用不上：
    # 留着是为了以后切成 history 模式时不用再改 nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # WebSocket：Upgrade / Connection 两个头缺一不可，
    # 少了它们握手会被当成普通 HTTP 请求，表现为"页面正常但推送永远收不到"。
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;   # 必须大于前端 30s 心跳，否则空闲连接被掐
    }

    # 带内容哈希的静态资源可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
